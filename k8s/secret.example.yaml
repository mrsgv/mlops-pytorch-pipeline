# TEMPLATE ONLY - never commit a real Secret.
#
# k8s/secret.yaml is in .gitignore. Create the Secret imperatively instead so
# the value never touches the repository:
#
#   kubectl create secret generic serving-secrets \
#       --from-literal=MODEL_API_KEY="$(openssl rand -hex 24)" \
#       -n ml-training
#
# The serving Deployment references it with `optional: true`, so the service
# runs unauthenticated until this Secret exists. Once it does, /predict and
# /reload require the header  X-API-Key: <value>.
apiVersion: v1
kind: Secret
metadata:
  name: serving-secrets
  namespace: ml-training
  labels:
    app: model-serving
type: Opaque
stringData:
  MODEL_API_KEY: replace-me-do-not-commit
