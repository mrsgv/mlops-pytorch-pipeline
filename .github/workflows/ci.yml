name: CI

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  # Cheapest job first: pure-YAML checks need no torch, so a broken manifest
  # fails in ~20s instead of after a 3-minute dependency install.
  manifests:
    name: Validate k8s manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install PyYAML and pytest
        run: pip install PyYAML==6.0.3 pytest==9.1.1
      - name: Assert manifests satisfy the deployment contract
        run: pytest tests/test_manifests.py -v

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install ruff==0.16.5
      - run: ruff check src tests
      - run: ruff format --check --diff src tests

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install CPU-only torch, then the pinned runtime deps
        # torch 2.11's PyPI wheel depends on cuda-toolkit for every Linux
        # platform, so the CPU index keeps this at ~200 MB instead of ~7 GB.
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.11.0 torchvision==0.26.0 \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple
          pip install -r requirements/serve.txt -r requirements/dev.txt
      - name: pytest
        run: pytest -v
      - name: Smoke-test training on a truncated epoch
        # Proves the container entrypoint works end to end, including the
        # checkpoint write, without downloading CIFAR-10 in CI.
        run: pytest tests/test_train_config.py::test_one_short_epoch_trains_and_checkpoints -v

  docker:
    name: Build images
    runs-on: ubuntu-latest
    needs: [manifests, lint]
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: docker/Dockerfile.train
            image: mlops-train
          - dockerfile: docker/Dockerfile.serve
            image: mlops-serve
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.image }}
        # No build-args needed: both Dockerfiles default TORCH_INDEX_URL to the
        # CPU wheel index and fail the build if CUDA packages sneak in.
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          tags: ${{ matrix.image }}:ci-${{ github.sha }}
          push: false
          load: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Report image size
        run: docker images ${{ matrix.image }}:ci-${{ github.sha }}
      - name: Assert the serving image runs as a non-root user
        if: matrix.image == 'mlops-serve'
        run: |
          uid=$(docker run --rm --entrypoint id ${{ matrix.image }}:ci-${{ github.sha }} -u)
          echo "serving container uid=$uid"
          test "$uid" != "0"
      - name: Assert the serving image carries no training libraries
        if: matrix.image == 'mlops-serve'
        run: |
          if docker run --rm --entrypoint pip ${{ matrix.image }}:ci-${{ github.sha }} \
               show tensorboard > /dev/null 2>&1; then
            echo "tensorboard must not be installed in the serving image" >&2
            exit 1
          fi
          echo "no training libraries present"
